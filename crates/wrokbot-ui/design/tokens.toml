bg = "#FFFFFF"
bg_subtle = "#FAFAFA"
bg_chip = "#EDEDED"
bg_sidebar = "#F9F9F9"
bg_popover = "#FFFFFF"      # popover / menu / dialog 底
bg_inverse = "#292929"
