# Wrok Bot UI v5.1 — frozen visual token roles
#
# 真源文档：repository contract
# 本文件投影冻结视觉值；如有冲突，以已授权的现行视觉规范为准，
# 同批同步机器值与受控 CSS 映射，并保留漂移检查。
#
# 消费者（GUI 方案 §4.1、§13）：
#   crates/wrokbot-ui/build.rs 从本文件生成
#     ① design/tokens.css —— 三块同源，不手写：
#          :root { … }                                        亮色（[color.light]）
#          .dark { … }                                        强制暗（[color.dark]）
#          @media (prefers-color-scheme: dark) {
#            :root:not(.light) { … }                          跟随系统（同 [color.dark]）
#          }
#        非颜色 token（[radius] [size] [z_index] [typography] [motion]）只进 :root 一块，
#        它们不随主题变化；随主题变化的非颜色量（阴影强度、图片压暗）已经做成 color 段的
#        shadow_popover / shadow_dialog / image_dim（GUI 方案 §4.1 禁 `dark:` 变体的前提）。
#     ② src/tokens.rs（生成，不入库）—— compiled component 与对比度单测 token_contrast_wcag_aa 共用。
#
# 命名约定：本文件的 key 用 snake_case（TOML 惯例 + Rust 常量直接派生）；
# 生成的 CSS 自定义属性名用 kebab-case，规则 = key 里的 `_` 换成 `-`，前缀见每段的 css_prefix。
# 例：[color.light] 的 bg_subtle → `--bg-subtle`；[radius] 的 md → `--radius-md`。

schema_version = 1

# 生成器契约：build.rs 必须按这三个选择器产出三块，且亮/暗两块的 key 集合逐字相等。
[meta]
light_selector = ":root"
dark_selector = ".dark"
system_dark_media = "(prefers-color-scheme: dark)"
system_dark_selector = ":root:not(.light)"

# 哪些段进 tokens.css，哪些段只进 tokens.rs。
#
# 判据：Tailwind v4 自己有 @theme namespace 的量（颜色 / 字体栈 / 字号阶 / 圆角阶 / 缓动 /
# 断点）在 design/app.css 的 `@theme inline` 里声明一次；tokens.css 再声明一遍同名自定义
# 属性会与它撞名（`--radius-sm: var(--radius-sm)` 是自引用，直接失效）。所以：
#   * 颜色是唯一既进 tokens.css 又被 @theme inline 引用的段——它必须随主题切三块，而
#     @theme inline 只能声明一次。tokens.css 用 `--bg` 这类无前缀名，@theme 那边写
#     `--color-bg: var(--bg)`，两个名字不同，不自引用。
#   * Tailwind 没有 namespace 的量（z-index 阶、控件高度 / 固定尺寸、动效时长与级联参数、
#     CJK 排版覆盖）只进 tokens.css。
#   * 其余（字体栈、字号阶、圆角阶、缓动、断点）只进 tokens.rs，值在 app.css 手写一份。
css_emit_sections = ["color", "z_index", "size", "motion", "typography_cjk"]
rust_emit_sections = ["color", "typography", "spacing", "radius", "border", "focus", "size", "breakpoint", "z_index", "shadow", "motion"]

# 重复来源的漂移闸门（status = done）：
# app.css 的 `@theme inline` 手写了 typography.font_sans / font_mono / typography.scale /
# radius.{sm,md,lg,xl} / motion.ease_{enter,exit} / breakpoint.{md,lg}。必须有一条测试解析
# app.css 与本文件、断言这几组值逐字相等；否则改了本文件而 app.css 没跟，界面按 app.css 走、
# 测试按本文件走，两边各自「正确」，全绿且不一致。
# 解除条件 = crates/wrokbot-ui 里存在该测试并被 `cargo test -p openbot-ui` 跑到。
css_theme_drift_gate = "done"

# ---------------------------------------------------------------------------
# §4.2 颜色（亮 / 暗两套）
#
# 对比度判据（GUI 方案 §4.2，单测 token_contrast_wcag_aa 读本文件）：
#   文字 token（fg / fg_secondary / fg_muted / danger / caution / success / info）
#     对每个可作其底的背景 token（bg / bg_subtle / bg_chip / bg_sidebar / bg_popover）≥ 4.5:1；
#   fg_inverse 对 bg_inverse ≥ 4.5:1；
#   ring 与 chart_* 对 bg ≥ 3:1。
# 2026-08-22 在本文件上实跑全交叉对（7 文字 × 5 底 × 2 主题 + 2 inverse + 12 图形 = 84 对）：
#   pairs: 84  failures: 0，最低一对 = 暗色 fg_muted on bg_chip = 4.59:1。
# 注：GUI 方案 §17 的脚本只算 66 对（它排除了 fg_muted on bg_popover，且 danger/caution/
# success/info 只对 2–3 个底）。84 对是 66 对的超集，两者都为 0 failure；单测按 84 对写。
# Batch18 另给 avatar_0..7 增加 fg 对比度 8×2=16 对独立单测；不把头像底加入所有文字 token
# 的 surface 全交叉，因为它只承载 Avatar initials 的 fg，不是通用页面 surface。
# 改任何值都必须让该单测继续为绿。
# ---------------------------------------------------------------------------
[color]
css_prefix = ""

# 文字类 token（对比度判据的分子）
text_tokens = ["fg", "fg_secondary", "fg_muted", "danger", "caution", "success", "info"]
# 可作文字底的背景 token（对比度判据的分母）
surface_tokens = ["bg", "bg_subtle", "bg_chip", "bg_sidebar", "bg_popover"]
# 非文字、只需 3:1 的 token
graphic_tokens = ["ring", "chart_1", "chart_2", "chart_3", "chart_4", "chart_5"]

# CSS 自定义属性名覆盖。默认规则是 key 里的 `_` 换 `-`（bg_subtle → --bg-subtle），
# 这两个是例外：app.css 的 `@theme inline` 要声明 `--shadow-popover` 才能生成
# `shadow-popover` utility（§12.6 的 `rg 'shadow-(?!popover|dialog|none)'` 判的就是这个
# utility 名）。若 tokens.css 里的原始 token 也叫 `--shadow-popover`，
# `--shadow-popover: var(--shadow-popover)` 就是自引用。故原始 token 改名 `--elevation-*`，
# utility 名不变。
[color.css_var_overrides]
shadow_popover = "elevation-popover"
shadow_dialog = "elevation-dialog"

