fg_muted = "#666666"
fg_inverse = "#FFFFFF"      # primary 按钮文字
border = "#E7E7E7"
ring = "#1A1A1A"            # :focus-visible 环（中性，不用品牌色）
danger = "#B42318"          # 错误文字 / 图标 / 状态点
caution = "#9A5100"         # 警告
success = "#067647"         # 成功 / 在线
