[package]
name = "openbot-ui"
description = "Leptos CSR/WASM（v3 §5.1 / §13.1；视觉真源 = 设计系统文档）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.leptos-i18n]
default = "en"
locales = ["en", "zh-CN"]
locales-dir = "locales"

[package.metadata.openbot-ui]
generated-assets = ["design/tokens.css"]

[lints]
workspace = true

[features]
default = []
# Compile-time-only primitive gallery from GUI first source §10.3. Production Trunk builds do not
# enable it, and bundle-budget rejects the route literal if it ever appears in the release WASM.
design-gallery = []

[dependencies]
openbot-contracts.workspace = true
serde_json.workspace = true
base64.workspace = true
time.workspace = true
url.workspace = true
leptos.workspace = true
leptos_router.workspace = true
leptos_meta.workspace = true
leptos_i18n.workspace = true
sha2.workspace = true
serde.workspace = true
zeroize.workspace = true
uuid = { workspace = true, features = ["js"] }

# UI transcript consumers; versions retained from the audited G candidate, not floated.
pulldown-cmark = { version = "=0.13.4", default-features = false }
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util.workspace = true
gloo-net.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Blob", "BlobPropertyBag", "Url", "BinaryType", "CloseEvent", "WebSocket", "HtmlImageElement", "VisibilityState", "Performance"] }

[build-dependencies]
leptos_i18n_build.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
toml.workspace = true
