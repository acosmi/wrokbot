# ===========================================================================
# 品牌标（design/brand/，不进 Lucide allowlist）
#
# GUI 方案 §4.6.3：sign-in 按钮（Google / Microsoft / Okta，parity 于上游
# app/src/components/auth/provider-logo.tsx 的 GoogleMark / MicrosoftMark / OktaMark）
# 与连接器行（Google Drive，parity 于上游 IconBrandGoogleDrive）使用各家官方 SVG 标志，
# 不改色、不描边、不与 Lucide 混排进 allowlist。
# 每个文件的来源 URL、版本与使用条款登记进 v3 §19.3 的 provenance/sources.spdx.json。
# 这是原则 5「语义色不落图标」的唯一例外，因为品牌标不是语义色。
#
# status = todo：品牌标 SVG 本身尚未取得（各家品牌资产有独立的下载入口与使用条款，
# 需逐个核对许可后才能入库）。解除条件 = 四个 SVG 落到 design/brand/ 且 sources.spdx.json
# 有对应条目。Phase 0 只固定契约，不静默用 Lucide 图标顶替。
# ===========================================================================

