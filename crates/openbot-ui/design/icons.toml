# OpenBot 图标 allowlist 单一真源
#
# 真源文档：repository contract §4.6
# 文档 §4.6.2 的映射表、本文件的 upstream_tabler/name 与 parity/ui.yaml 图标 target 由
# design-lint 三向逐条 join；任一不一致直接判红，不允许在冲突时静默选择其中一份。
#
# 消费者（GUI 方案 §4.6.1、§13）：
#   crates/openbot-ui/build.rs 读本文件 + design/icons/<name>.svg，生成 src/icons.rs 的
#   `Icon` 枚举与 `view!` 片段。
#
# 闸门（xtask design-lint，两向零漂移）：
#   ① 源码里出现的每个 `Icon::X` 必须在本文件的 [[icon]] 里；
#   ② design/icons/ 里的每个 SVG 必须被本文件收录，且被源码引用；
#   ③ 本文件的每个 name 必须在 design/icons/ 有同名 .svg。
#
# SVG 处理（GUI 方案 §4.6.1）：从 Lucide 1.33.0 官方 zip 抽出后，把根元素的
# stroke-width 由 Lucide 默认的 2 改写为 1.75，其余字节不动；颜色 currentColor（Lucide 原样）。
# 渲染尺寸只有 16（行内 / 文字旁）与 20（导航 / 按钮），由调用点决定，不写进 SVG。
# 许可证文本进 NOTICE。
#
# 字段说明：
#   name            —— Lucide 1.33.0 的图标名，等于 design/icons/<name>.svg 的文件名。
#   label           —— parity | 新增 | 替代。parity = 上游同一图标槽位存在（见 upstream_tabler）；
#                      新增 = 上游没有这个槽位，本项目新加的页面 / 控件需要。
#   upstream_tabler —— 上游 @tabler/icons-react 的组件名。仅 label = "parity" 的条目有此字段。
#   upstream_usage  —— 该 Tabler 组件在上游 891df72f 的 app/src 下的引用文件（相对 app/src）。
#                      2026-08-22 由 grep -rlE '\b<name>\b' --include=*.tsx --include=*.ts 实跑得到，
#                      是事实不是推断。
#   purpose         —— 本项目的用途说明（首版裁决，非上游断言）。

schema_version = 1

[meta]
icon_set = "lucide"
icon_set_version = "1.33.0"
icon_set_license = "ISC"
source_zip = "lucide-icons-1.33.0.zip"
source_zip_sha256 = "53831c8def65621f88cae315cdb38ac70db1d937062df35c93546efb00260a98"
source_zip_svg_count = 1776
stroke_width = "1.75"
lucide_default_stroke_width = "2"
render_sizes = [16, 20]
color = "currentColor"
icons_dir = "design/icons"
brand_dir = "design/brand"
# 46 个映射自上游 Tabler + 28 个新增 = 74
expected_icon_count = 74

# 上游图标全集的事实基线（GUI 方案 §17 的复算命令，本轮实跑复现）：
# cd <upstream>/app/src && grep -rhoE '\bIcon[A-Z][A-Za-z0-9]+' --include=*.tsx --include=*.ts . | sort -u | wc -l  == 47
# 47 = 46 个映射到 Lucide + 1 个 IconBrandGoogleDrive 走品牌标（见 [[brand]]）。
upstream_commit = "891df72f1827454d8b353d108fe5dd2313b7e30d"
upstream_tabler_icon_count = 47
upstream_tabler_mapped_to_lucide = 46
upstream_tabler_mapped_to_brand = 1

