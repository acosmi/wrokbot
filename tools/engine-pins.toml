# tools/engine-pins.toml —— 随发行物交付的外部引擎钉版（v3 §1.2 / §11.3 / §16.2 / §16.3，R117）
#
# 与 tools/pins.toml 的区别：pins.toml 是构建期工具（不进发行物）；本文件是**进发行物**、参与
# release epoch 与签名、由 Rust 监管的外部引擎。engine 的 "lockfile" 就是本文件，不存在 npm lock。
#
# 消费者（Batch52 fetch/verify；Batch53 macOS bundle；Batch54 Windows PE；Batch55 runsc harness，v4 §19.1）：
#   `cargo xtask engine fetch`    按本平台 artifacts 下载到 `target/engine/<id>/`，先校 sha256 再解包
#   `cargo xtask engine verify`   P0 校验 sha256 / `--version`；P1 bundle 后扩到 fuses / ASAR / epoch
#   `cargo xtask engine bundle`   P1：rebrand → shim ASAR → fuses → integrity → sidecar manifest（零 npm）
#   `cargo xtask engine runsc-spike ...` P1：只在Ubuntu24 x64真机全绿后打印runsc pin candidate
# 当前 macOS verify 同时覆盖 archive sha256 / SHASUMS / `--version` 与 bundle 的 ASAR、fuses、
# rebrand、integrity、signature、release epoch、protocol、manifest；Batch109又在macOS以v2重建并
# 实跑普通输入。Batch54 的 Windows PE
# `Integrity/ElectronAsar`、Named Pipe、Job/restricted-token 只取得 target check/Clippy；Windows/Linux
# 平台专属 runtime 证据仍缺，不能从 macOS 外推。`cargo xtask tools` 不读本文件。
# Batch55刻意没有runsc/Xvfb条目：harness未在Linux运行前，runsc版本/URL/hash与rootfs
# Xvfb package version/binary hash都不得预填。
#
# 字段约定与 tools/pins.toml 相同（version / license / install / artifacts[] / sha256_source /
# url_http_status / verify.* / status）。status 口径与 parity ledger 一致：没有本轮实证的一律 todo。

schema = "engine-pins"
schema_version = 1
generated_by = "manual"
generated_at = "2026-08-28"
# 本文件所有 sha256、HTTP 状态码与实跑结果都在 2026-08-28 本机（Windows 11，Git Bash，
# curl 走 GitHub 作用域代理）取得；复算命令见文件末尾 [recount] 与 v3 §28.4。

# ===========================================================================
# Electron（Browser Computer 与 Desktop sandboxed component 的单一 engine package，v3 §11.1）
# ===========================================================================
[engines.electron]
version = "43.3.0"
release_epoch = 5
protocol_version = 4
chromium = "150.0.7871.212"
node = "24.18.1"
license = "MIT"
license_evidence = "raw.githubusercontent.com/electron/electron/v43.3.0/LICENSE 首两行为 `Copyright (c) Electron contributors` / `Copyright (c) 2013-2020 GitHub Inc.`，随后是 MIT 许可正文；Chromium / Node / FFmpeg 等第三方 notices 随发行包原样交付（v3 §23.1 条 5）"
install = "download"
repo = "electron/electron"
release_tag = "v43.3.0"
release_url = "https://github.com/electron/electron/releases/tag/v43.3.0"
published_at = "2026-08-04T18:52:37Z"
prerelease = false
release_notes_evidence = "GitHub API releases/tags/v43.3.0 的 body 含 `Updated Chromium to 150.0.7871.212` 与 `Updated Node.js to v24.18.1`"
checksums_manifest = "https://github.com/electron/electron/releases/download/v43.3.0/SHASUMS256.txt"
checksums_manifest_http_status = 200
checksums_manifest_copy = "tools/electron-v43.3.0.SHASUMS256.txt"
status = "done"
done_evidence = "五个平台 zip 的 sha256 与上游 SHASUMS256.txt 逐字相等；windows-x64 真下载 144,396,349 B、macos-arm64 真下载 122,102,881 B，二者 `--version` = `v43.3.0`。Batch53/109先取得macOS protocol 1/2基线；Batch110升级到epoch/protocol 3后重跑bundle/verify，ASAR=29806 B/header 02972340…/fuses 000011001，并以双role正式screencast/ACK/latest-buffer 4/0/0闭合本平台证据。Batch115升级epoch/protocol4，ASAR30069 B/header d795c804…/shim595，双role暂停恢复与既有输入回归通过；Windows/Linux bundle专属证据仍未跑，不冒充三平台已验"
notes = """
获取渠道只有官方 GitHub release zip（v3 §1.2 / R117）；不经 npm，因此没有 package-lock。
Electron zip 解压后是未签名的通用二进制：rebrand、shim ASAR、fuses、ASAR integrity 与签名全部在
`cargo xtask engine bundle` 里做（v3 §11.3 / §16.2），发行物里的 engine 不是这里的原始 zip。
linux-arm64 只为 Server 多架构镜像预留；Linux Desktop 是 tier-2（R122）。
Chromium critical/high 修复 72 小时内升级（v3 §11.3）：升级 = 改本文件 + 替换 SHASUMS 副本 + delta audit。
"""

  [engines.electron.verify]
  args = ["--version"]
  stream = "stdout"
  expect_regex = "^\\s*v43\\.3\\.0\\s*$"
  expect_exit_code = 0
  verified_on = "windows-x64,macos-arm64"
  status_verify = "done"
  known_trap = """
Windows 上 electron.exe 是 GUI 子系统程序：从 PowerShell 用 `$v = & electron.exe --version` 捕获得到空串，
从 Git Bash 把 stdout 重定向到文件（`./electron.exe --version > ver.txt 2>&1`）得到一个空行加 `v43.3.0`。
所以 expect_regex 允许前后空白，且 verify 实现必须走 pipe/文件重定向而不是 console 捕获。
Codex 默认 macOS 命令沙箱会把 Electron GUI 子系统进程以 SIGABRT 阻断；宿主普通 shell/获准执行
同一 binary `--version` 正常返回 v43.3.0。这是验证环境边界，不允许跳过版本校验。
"""

  [[engines.electron.artifacts]]
  platform = "macos-arm64"
  asset = "electron-v43.3.0-darwin-arm64.zip"
  url = "https://github.com/electron/electron/releases/download/v43.3.0/electron-v43.3.0-darwin-arm64.zip"
