# ===========================================================================
# 复算命令（cwd = repo，干净 checkout 上可跑）
# ===========================================================================
[[recount]]
id = "electron-sha-crosscheck"
command = "for p in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do a=$(grep \"electron-v43.3.0-$p.zip\" tools/electron-v43.3.0.SHASUMS256.txt | cut -c1-64); b=$(grep -A3 \"asset = \\\"electron-v43.3.0-$p.zip\\\"\" tools/engine-pins.toml | grep -oE '[0-9a-f]{64}'); [ \"$a\" = \"$b\" ] && echo \"$p MATCH\" || echo \"$p DIFFERS\"; done"
cwd = "repo"
repo_reproducible = true
expect = """
darwin-arm64 MATCH
darwin-x64 MATCH
linux-x64 MATCH
linux-arm64 MATCH
win32-x64 MATCH"""

[[recount]]
id = "electron-artifact-count"
command = "grep -cE '^  \\[\\[engines\\.electron\\.artifacts\\]\\]$' tools/engine-pins.toml"
cwd = "repo"
repo_reproducible = true
expect = 5

[[recount]]
id = "electron-sha-shape"
command = "grep -A3 'asset = \"electron-v43.3.0-' tools/engine-pins.toml | grep -oE '[0-9a-f]{64}' | sort -u | wc -l"
cwd = "repo"
repo_reproducible = true
expect = 5
note = "五个平台各一个互不相同的合法摘要；照得出复制粘贴把两个平台写成同一个摘要。"

[[recount]]
id = "electron-sums-copy-lines"
command = "wc -l < tools/electron-v43.3.0.SHASUMS256.txt"
cwd = "repo"
repo_reproducible = true
expect = 74
note = "上游 SHASUMS256.txt 原样副本（75 条记录，末行无换行符，故 wc -l 为 74）。升级 Electron 时整文件替换。"
