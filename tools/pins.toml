status = "done"
done_evidence = "五个平台的 sha256 取自同 release 的 `.sha256` 边车文件，本轮逐个下载；仓内可复算的一半 = recount `binaryen-sha-shape`（五个互不相同的合法摘要），与上游边车逐字比对的一半 = recount `binaryen-sha-vs-upstream`（2026-08-22 实跑得 SAME，但边车聚合文件未入库，干净 checkout 上跑不起来）。GUI §12.1 只写了『各平台 sha256 进 pins.toml』没给值，值是本轮补的"
notes = """
GUI §12.1 的表格里 binaryen 那一行**没有列出任何 sha256**（正向对照：同一表格的
Tailwind 行列了五个），因此本文件的五个摘要是本轮新取的，不是抄表。
