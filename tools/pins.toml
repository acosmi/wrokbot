# tools/pins.toml —— 构建期工具二进制钉版
#
# 真源：GUI 设计系统文档 §12.1〈工具二进制钉版〉那张表的机器可读版；由 v3 §19.3 的
# Phase 0 必做产物清单点名（`tools/pins.toml`），由 v3 §16.3 的 supply chain 闸门消费。
#
# 消费者：
#   `cargo xtask tools fetch`   按 [tools.<id>.artifacts] 下载到 `target/tools/bin`
#   `cargo xtask tools verify`  校验 sha256 与 [tools.<id>.verify]，任一不符即红
# 两个子命令由 `crates/openbot-testkit/src/xtask/tools.rs` 实现；下载件先校本平台
# sha256 再安装，cargo-install 件按本表/lock 精确版本安装，`verify` 再核版本输出。
#
# 这些工具**不进发行物**（GUI §12.1 末段）：v3 §0.1 的"第一方非 Rust 源码只有 Electron
# shim"说的是发行物，构建期二进制按 v3 §16.3 的供应链条目管理。
#
# ---------------------------------------------------------------------------
# 字段约定
# ---------------------------------------------------------------------------
# version            钉死的版本号，与 GUI §12.1 逐字相同。
# license            SPDX 表达式；来源写在 license_evidence。
# install            "download"（GitHub release 资产）或 "cargo-install"（从 crates.io 装）。
# artifacts[]        仅 install="download" 时存在。platform 用统一键：
#                    linux-x64 / linux-arm64 / macos-arm64 / macos-x64 / windows-x64。
# sha256_source      这个摘要是谁给的：
#                      "upstream-sha256sums"   上游 release 的 sha256sums.txt / .sha256 边车
#                      "local-download"        本轮实际下载后本机 sha256sum 算出
#                    两者都不是"独立第三方"——被攻陷的 release 会同时给出一致的摘要。
#                    独立性由 v3 §16.3 的 reproducibility check 另行承担，不由本文件冒充。
# url_http_status    本轮实测的 HTTP 状态码（301/302 跟随后的最终码），0 = 本轮未探测。
# verify.*           `xtask tools verify` 的期望。stream 字段是必须的：见下面 tailwindcss
#                    的 known_trap —— `--version` 的版本号在 **stderr**，stdout 是 CSS。
# status             todo / in_progress / done，口径与 parity ledger 一致：
#                    没有本轮实证的一律 todo，不写假 done。

schema = "tools-pins"
schema_version = 1
generated_by = "manual"
generated_at = "2026-08-22"
# 本文件所有 sha256 与 HTTP 状态码都在 2026-08-22 本机（Windows 11，Git Bash，
# curl 走 GitHub 作用域代理）实跑取得；复算命令见文件末尾 [recount]。

# ===========================================================================
# Tailwind CSS standalone CLI
# ===========================================================================
[tools.tailwindcss]
version = "4.3.3"
license = "MIT"
license_evidence = "本轮实跑 `tailwindcss-windows-x64.exe --version`，stdout 首行为 `/*! tailwindcss v4.3.3 | MIT License | https://tailwindcss.com */`"
install = "download"
repo = "tailwindlabs/tailwindcss"
release_tag = "v4.3.3"
release_url = "https://github.com/tailwindlabs/tailwindcss/releases/tag/v4.3.3"
checksums_manifest = "https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/sha256sums.txt"
checksums_manifest_http_status = 200
status = "done"
done_evidence = "五个平台的 sha256 与 release 的 sha256sums.txt 逐字相等（recount tw-sha-crosscheck）；windows-x64 另有本机下载后 sha256sum 端到端相符并跑通 --version"
notes = """
musl 两件（tailwindcss-linux-x64-musl / tailwindcss-linux-arm64-musl）刻意不收，
与 GUI §12.1 的"musl 两件不用"一致；它们确实存在于同一份 sha256sums.txt 里，
所以"不收"是裁决不是漏抄（正向对照见 recount tw-musl-present）。
trunk 通过 `[tools] tailwindcss = "4.3.3"` 在 PATH 上找同名二进制并比对版本，
`[build] offline = true` 下找不到或版本不符直接报错不下载（GUI §12.1）。
"""

  [tools.tailwindcss.verify]
  args = ["--version"]
  stream = "stderr"
  expect_regex = "tailwindcss v4\\.3\\.3"
  expect_exit_code = 0
  verified_on = "windows-x64"
  known_trap = """
`tailwindcss --version` 不是纯版本查询：本轮实测（windows-x64，exit=0）
stderr 只有 86 字节，内容是 ANSI 着色的 `≈ tailwindcss v4.3.3` 加一行 `Done in 812ms`；
stdout 是 98,986 字节的编译产物 CSS，首行 `/*! tailwindcss v4.3.3 | MIT License | ... */`。
所以只读 stdout 的朴素 `--version` 校验会拿到 ~97 KiB CSS 而不是版本串。
比对前必须剥 ANSI 转义（stderr 里 `v4.3.3` 前后各有 `\\x1b[34m` / `\\x1b[39m`）。
另一条同样成立的判据是 stdout 首行的 banner 注释；这里选 stderr 是因为它体量恒定。
"""

  [[tools.tailwindcss.artifacts]]
  platform = "linux-x64"
  asset = "tailwindcss-linux-x64"
  url = "https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64"
  sha256 = "dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a"
  sha256_source = "upstream-sha256sums"
  url_http_status = 200

  [[tools.tailwindcss.artifacts]]
