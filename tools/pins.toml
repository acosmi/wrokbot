# ===========================================================================
# 复算命令
#
# cwd = "repo" 指本仓根，这类条目在**干净 checkout 上就能跑**，是真闸门。
# cwd = "scratchpad" 指产生它的那次会话的临时取证目录 —— 该目录随会话消失、不入库，
# 所以这类条目**在干净 checkout 上跑不起来**，只是当时那一跑的留痕。每条都必须自带
# `repo_reproducible = false` + `blocked_by`，禁止让它们混在真闸门里冒充可复算。
# 同族的另一处在 fixtures/README.md（cel-corpus 的生成脚本不在仓内），两处口径一致。
# ===========================================================================
[[recount]]
id = "tw-sha-crosscheck"
command = "for p in linux-x64 linux-arm64 macos-arm64 macos-x64 windows-x64.exe; do doc=$(grep -oE \"\\`$p\\` \\`[0-9a-f]{64}\\`\" repository contract | grep -oE '[0-9a-f]{64}'); pin=$(grep -A3 \"asset = \\\"tailwindcss-$p\\\"\" tools/pins.toml | grep -oE '[0-9a-f]{64}'); [ \"$doc\" = \"$pin\" ] && echo \"$p MATCH\" || echo \"$p DIFFERS\"; done"
cwd = "repo"
repo_reproducible = true
expect = """
linux-x64 MATCH
linux-arm64 MATCH
macos-arm64 MATCH
macos-x64 MATCH
windows-x64.exe MATCH"""
note = "expect 由 2026-08-22 的真实 stdout 逐字抄回（原先写的是散文『五行全部 MATCH』，机器没法比对）。"

[[recount]]
id = "tw-musl-present"
command = "grep -c 'musl' tw-sums.txt"
cwd = "scratchpad"
repo_reproducible = false
expect = 2
blocked_by = "`tw-sums.txt` 是会话取证文件，不在本仓。解除条件 = 把 Tailwind release 的 sha256 边车入库到 `tools/`，再把 cwd 改成 repo。"

[[recount]]
id = "binaryen-sha-shape"
command = "grep -A3 'binaryen-version_132-' tools/pins.toml | grep -oE '[0-9a-f]{64}' | sort -u | wc -l"
cwd = "repo"
repo_reproducible = true
expect = 5
note = "仓内可跑的那一半：五个平台资产各有一个互不相同的合法 sha256。它照得出『复制粘贴把两个平台写成同一个摘要』，照不出『摘要与上游不符』—— 后者由下面的 binaryen-sha-vs-upstream 负责。"

[[recount]]
id = "binaryen-sha-vs-upstream"
command = "grep -oE '[0-9a-f]{64}' \"$BINARYEN_SUMS\" | sort > /tmp/a; grep -A3 'binaryen-version_132-' tools/pins.toml | grep -oE '[0-9a-f]{64}' | sort > /tmp/b; diff /tmp/a /tmp/b && echo SAME"
cwd = "repo"
repo_reproducible = false
expect = "SAME"
env_required = "BINARYEN_SUMS = 五个 `.sha256` 边车的聚合文件路径"
last_run = "2026-08-22 实跑得 SAME（聚合文件在当次会话取证目录，未入库）"
blocked_by = "聚合文件不在本仓，干净 checkout 上跑不起来。解除条件 = 把 release 的五个 `.sha256` 边车原样入库到 `tools/binaryen-version_132.sha256sums`，把命令里的 `$BINARYEN_SUMS` 换成该路径，并把 repo_reproducible 改 true。原先此条的命令里写的是字面量 `<取证目录>` 占位符 —— 那是一条谁也跑不了的命令，不是闸门。"

[[recount]]
id = "wasm-bindgen-absent"
command = "grep -c 'name = \"wasm-bindgen\"' Cargo.lock"
cwd = "repo"
repo_reproducible = true
expect = 0

[[recount]]
id = "wasm-bindgen-absent-positive-control"
command = "grep -c 'name = \"serde\"' Cargo.lock"
cwd = "repo"
repo_reproducible = true
expect = 1
note = "上一条『lock 里没有 wasm-bindgen』的正向对照：同一条 grep 形态在确实存在的包上能命中，说明 0 不是命令写错"

[[recount]]
id = "pins-artifact-count"
command = "grep -cE '^  \\[\\[tools\\.[a-z-]+\\.artifacts\\]\\]$' tools/pins.toml"
cwd = "repo"
repo_reproducible = true
expect = 10

[[recount]]
id = "pins-tool-count"
command = "grep -cE '^\\[tools\\.[a-z-]+\\]$' tools/pins.toml"
cwd = "repo"
repo_reproducible = true
expect = 4
