# ===========================================================================
# trunk（Leptos/WASM 构建驱动）
# ===========================================================================
[tools.trunk]
version = "0.21.14"
license = "MIT OR Apache-2.0"
license_evidence = "crates.io API `.version.license` = `MIT/Apache-2.0`；仓库 v0.21.14 同时存在 LICENSE-MIT 与 LICENSE-APACHE（各 HTTP 200），单文件 LICENSE 为 404（正向/负向对照同一条命令）"
install = "cargo-install"
crate = "trunk"
crates_io_cksum = "4f7fe1b23957a580be9a7a8b305c331b2977989f33695128d663380d09eaea37"
cksum_source = "index.crates.io 稀疏索引 `.cksum` 字段（即 cargo 自己校验的那一个）"
install_command = "cargo install --locked trunk --version 0.21.14"
repo = "https://github.com/trunk-rs/trunk/tree/v0.21.14"
status = "done"
done_evidence = "index checksum/license 已核；2026-08-25 macOS arm64 经 xtask cargo install --locked 真安装，stdout=`trunk 0.21.14`"
notes = """
GUI §12.1 只写了"由 xtask 执行并校验 `trunk --version`"，没有给期望串。
2026-08-25 已在 macOS arm64 真安装；上游 lock 含 yanked `crossbeam-channel 0.5.14` 与
`zip 2.6.1`，`--locked` 仍可重现，但该事实必须保留在 Batch 15 供应链证据中。
构建口径：`PATH=target/tools/bin:$PATH trunk build --release --offline --locked`。
"""

  [tools.trunk.verify]
  args = ["--version"]
  stream = "stdout"
  expect_regex = "0\\.21\\.14"
  expect_exit_code = 0
  verified_on = "macos-arm64"
  status_verify = "done"

